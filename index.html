<!doctype html>
<html lang="ko" data-root="./">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>출고 지시서</title>
    <link rel="stylesheet" href="chulgo.css" />
    <style>
      :root {
        --paper: #e6e8e3;
        --sheet: #f4f5f1;
        --ink: #1a2330;
        --quiet: #31404a;
        --spine: #1f6b5a;
        --line: #c5cbc3;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "Gowun Batang", "Apple SD Gothic Neo", serif;
        font-size: 1rem;
        line-height: 1.45;
      }

      main {
        margin: 0;
        padding: 0.45rem 0.75rem 0.4rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.2rem;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>출고 지시서</h1>
      <noscript>
        <p>정렬과 파일 열기는 스크립트를 켜야 동작합니다.</p>
      </noscript>
      <section class="work" aria-label="정렬 화면">
        <div class="toolbar noprint">
          <label class="file-btn primary">
            파일 열기
            <input id="file" type="file" multiple accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.heic,.heif,.csv,.tsv,.txt,.xlsx,.xls,text/csv" />
          </label>
          <button type="button" id="print" hidden>인쇄</button>
          <button type="button" id="suspects" hidden>확인할 칸만</button>
          <label class="inline" id="brand-label" hidden><input id="brand-sum" type="checkbox" /> 브랜드 소계</label>
          <label class="inline" id="sheet-label" hidden>
            시트
            <select id="sheet"></select>
          </label>
          <span class="grow"></span>
          <details class="more">
            <summary>더보기</summary>
            <div class="more-row">
              <button type="button" id="orig">원래 순서</button>
              <button type="button" id="print-look">인쇄 모양</button>
              <label class="inline" title="열 이름이 있는 줄">
                제목 줄
                <input id="header-row" type="number" min="1" step="1" value="1" inputmode="numeric" />
              </label>
              <label class="inline"><input id="hide-num" type="checkbox" /> 번호 숨김</label>
              <label class="inline"><input id="hide-ea" type="checkbox" checked /> EA 숨김</label>
              <label class="inline"><input id="hide-note" type="checkbox" checked /> 비고 숨김</label>
              <label class="inline">글자
                <select id="font">
                  <option value="sm">작게</option>
                  <option value="md" selected>보통</option>
                  <option value="lg">크게</option>
                </select>
              </label>
              <button type="button" id="csv">CSV</button>
              <button type="button" id="xlsx">Excel</button>
              <button type="button" id="clear" class="quiet">비우기</button>
            </div>
          </details>
        </div>
        <button type="button" id="screen-look" class="only-preview">검수 화면</button>
        <p class="sub" id="subtitle" hidden></p>
        <p class="meta facts" id="status" aria-live="polite"></p>
        <p class="error" id="error" role="alert" hidden></p>
        <div class="shots noprint" id="shots" hidden></div>
        <div class="table-wrap" id="drop">
          <p class="empty" id="empty">사진을 여기에 놓거나 누르세요.
같은 규격끼리 모읍니다.</p>
          <table id="grid" aria-describedby="status"></table>
        </div>
        <p class="sub" id="customers" hidden></p>
      </section>
    </main>
    <script src="vendor/xlsx.full.min.js"></script>
    <script src="vendor/ocr/tesseract.min.js"></script>
    <script src="chulgo.js"></script>
  </body>
</html>
